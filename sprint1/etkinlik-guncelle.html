<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Etkinlik Güncelle</title>
</head>

<body>

    <header>

        <h1>Etkinlik Güncelle</h1>

        <nav aria-label="Ana menü">
            <a href="index.html">Ana Sayfa</a>
        
            <a href="etkinlik-ekle.html">Ekle</a>
            <a href="etkinlik-guncelle.html">Güncelle</a>
        </nav>

    </header>

    <main>

        <section>

            <h2>Etkinlik Bilgilerini Güncelle</h2>

            <form action="index.html" method="get">

                <p>
                    <label for="etkinlikAdi">Etkinlik Adı</label>
                    <br>
                    <input
                        type="text"
                        id="etkinlikAdi"
                        name="etkinlikAdi"
                        value="Kariyer Günleri"
                        required
                    >
                </p>

                <p>
                    <label for="kategori">Kategori</label>
                    <br>

                    <select
                        id="kategori"
                        name="kategori"
                        required
                    >
                        <option value="">Seçiniz</option>
                        <option value="seminer" selected>Seminer</option>
                        <option value="atolye">Atölye</option>
                        <option value="konferans">Konferans</option>
                        <option value="soylesi">Söyleşi</option>
                    </select>
                </p>

                <p>
                    <label for="tarih">Tarih</label>
                    <br>

                    <input
                        type="date"
                        id="tarih"
                        name="tarih"
                        value="2026-10-12"
                        required
                    >
                </p>

                <p>
                    <label for="aciklama">Açıklama</label>
                    <br>

                    <textarea
                        id="aciklama"
                        name="aciklama"
                        rows="5"
                        cols="30"
                        required
                    >Mezun söyleşileri</textarea>
                </p>

                <p>
                    <button type="submit">Güncelle</button>
                </p>

            </form>

        </section>

    </main>

  
</body>

</html>
