$kind: http-request
url: "{{baseUrl}}/events/{{newId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "capacity": 55
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status 200", () => pm.response.to.have.status(200));
      const e = pm.response.json();
      pm.test("capacity 55", () => pm.expect(e.capacity).to.eql(55));
      pm.test("diğer alanlar değişmedi", () => pm.expect(e.title).to.eql("Runner Test Etkinliği"));
    language: text/javascript
order: 8000
