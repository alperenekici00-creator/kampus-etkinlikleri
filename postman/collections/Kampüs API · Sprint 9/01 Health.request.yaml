$kind: http-request
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("status 200", () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test("status ok", () => pm.expect(b.status).to.eql("ok"));
      pm.test("student dolu", () => pm.expect(String(b.student || "")).to.match(/\d{6,}/));
    language: text/javascript
order: 1000
