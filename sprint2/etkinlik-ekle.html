<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Ekle</title>
    <link rel="stylesheet" href="css/2321032033.css">
</head>
<body>
    <header>
        <h1>Etkinlik Ekle</h1>
        <nav aria-label="Ana menü">
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-ekle.html">Ekle</a>
            <a href="etkinlik-guncelle.html">Güncelle</a>
        </nav>
    </header>
    <main>
        <section>
            <form action="index.html" method="get">
                <p>
                    <label for="etkinlikAdi">Etkinlik Adı</label>
                    <input type="text" id="etkinlikAdi" name="etkinlikAdi" required>
                </p>
                <p>
                    <label for="kategori">Kategori</label>
                    <select id="kategori" name="kategori" required>
                        <option value="">Seçiniz</option>
                        <option value="seminer">Seminer</option>
                        <option value="atolye">Atölye</option>
                        <option value="konferans">Konferans</option>
                        <option value="soylesi">Söyleşi</option>
                    </select>
                </p>
                <p>
                    <label for="tarih">Tarih</label>
                    <input type="date" id="tarih" name="tarih" required>
                </p>
                <p>
                    <label for="aciklama">Açıklama</label>
                    <textarea id="aciklama" name="aciklama" rows="5" required></textarea>
                </p>
                <p>
                    <button type="submit">Kaydet</button>
                </p>
            </form>
        </section>
    </main>
</body>
</html>
